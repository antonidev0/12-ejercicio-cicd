name: 04 - Events

on:
    issues: 
        types: [opened, reopened]
    issue_comment: 
        types: [created]
    pull_request_review_comment: 
        types: [created]

jobs:
    inspect-event:
        runs-on: ubuntu-24.04
        permissions: 
            issues: write
        steps:
          - name: Inspect event
            run: |
                echo "Event: ${{ github.event_name }}"
                echo "Issue: ${{ github.event.issue.number }}"
                echo "Comment: ${{ github.event.comment.body }}"

          - name: Comentar como bot al abrir issue
            if: github.event_name == 'issues' && github.event.action == 'opened'
            run: gh issue comment ${{ github.event.issue.number }} --body "Gracias por el aporte,  Revisaremos tu issue pronto."
            env:
                GH_TOKEN: ${{ github.token }}


